# markdownlint-cli2 configuration for semedit repository

config:
  default: true
  # Disable line length rule for long technical descriptions and tables
  MD013: false
  # Allow duplicate heading titles across different parent sections
  MD024:
    siblings_only: true
  # Allow ordered list prefixes (1. 1. 1. or 1. 2. 3.)
  MD029:
    style: "one_or_ordered"

ignores:
  - ".git"
  - ".scratch"
  - "node_modules"
  - "vendor"
