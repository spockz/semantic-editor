# Preserves canonical domain terminology across Computer Science, Compilers, Machine Learning, LLMs, and AI.
extends: substitution
message: "Consider '%s' instead of '%s' for direct affirmative vocabulary."
level: suggestion
ignorecase: true
swap:
  not present: absent
  not active: quiescent
  not dense: sparse
  is not able to: cannot
  are not able to: cannot
