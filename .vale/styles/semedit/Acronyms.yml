# Requires a spelled-out form for initialisms that appear in Markdown pages.
extends: conditional
message: "Add a spelled-out form for '%s' on this page."
level: suggestion
ignorecase: false
first: '\b([A-Z]{2,6}(?:-[A-Z]{2,6})?)\b'
second: '(?:\b[A-Za-z][A-Za-z-]*\s+)+\(([A-Z]{2,6}(?:-[A-Z]{2,6})?)\)'
exceptions:
  - DONE
  - FAIL
  - ME
  - NO
  - PASS
  - RQ
  - ST
  - TBD
  - TODO
  - WHY
  - YES
  - GOPATH
