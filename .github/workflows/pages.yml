name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOENV: ${{ github.workspace }}/.scratch/go/env
      GOCACHE: ${{ github.workspace }}/.scratch/go/build
      GOMODCACHE: ${{ github.workspace }}/.scratch/go/mod
      GOTMPDIR: ${{ github.workspace }}/.scratch/go/tmp
      GOBIN: ${{ github.workspace }}/.scratch/go/bin
      GOPATH: ${{ github.workspace }}/.scratch/go
      GOPLSCACHE: ${{ github.workspace }}/.scratch/go/gopls
      GOFLAGS: ""
      GOWORK: "off"
      GOLANGCI_LINT_CACHE: ${{ github.workspace }}/.scratch/golangci-lint-cache
      HUGO_CACHEDIR: ${{ github.workspace }}/.scratch/hugo-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare project-local caches
        run: mkdir -p "$GOCACHE" "$GOMODCACHE" "$GOTMPDIR" "$GOBIN" "$GOPLSCACHE" "$GOLANGCI_LINT_CACHE" "$HUGO_CACHEDIR"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Read Hugo version
        id: hugo-version
        run: echo "version=$(tr -d ' \t\r\n' < .hugo-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.hugo-version.outputs.version }}
          extended: true

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build and verify documentation
        run: make verify-docs HUGO_BASE_URL="${{ steps.pages.outputs.base_url }}/" DOCGEN_ARGS="--enable-rss"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
