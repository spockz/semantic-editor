version: "2"

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true
  modules-download-mode: readonly

output:
  formats:
    text:
      path: stdout
      print-issued-lines: true
      print-linter-name: true
      colors: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gocritic
    - misspell
    - bodyclose
    - noctx
    - prealloc
    - gosec
    - unconvert
    - errorlint
    - nilerr
    - unparam
    - intrange
    - modernize
    - copyloopvar
    - nolintlint
    - durationcheck
    - makezero
    - usestdlibvars
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    revive:
      rules:
        - name: exported
          arguments: [disableStutteringCheck]
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    gosec:
      excludes:
        - G104
    misspell:
      locale: US
      ignore-rules:
        - cancelled
  exclusions:
    presets: []
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - noctx

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
